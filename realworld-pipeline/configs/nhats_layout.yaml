# NHATS public-use files -> canonical analytic extract (docs/DATA_CONTRACT.md).
#
# Variable names follow the NHATS public-use naming pattern: a topic prefix,
# the round number, then the item (hc1health = health conditions, round 1).
# "{r}" is replaced by the baseline round and "{k}" by each follow-up round,
# so one layout serves any baseline round (the thesis uses Round 5).
#
# CHECK EVERY NAME AND CODE AGAINST THE NHATS CODEBOOK FOR YOUR RELEASE.
# They were written from the NHATS naming conventions without the codebook to
# hand. `hpotential nhats-check` lists every configured variable that is
# absent from your files and every value outside the declared codes, and the
# build refuses to run while any are missing.

release:
  # The thesis protocol indexes at Round 5 (2015 replenishment cohort and
  # continuing participants) with five annual follow-ups, Rounds 6-10.
  baseline_round: 5
  follow_up_rounds: [6, 7, 8, 9, 10]  # five annual follow-ups -> five-year horizon
  days_per_round: 365.25               # NHATS interviews roughly a year apart

files:                                  # file names inside --data-dir; .dta, .sas7bdat, .csv or .parquet
  sp: "NHATS_Round_{r}_SP_File"
  tracker: "NHATS_Round_{k}_Tracker_File"   # the latest tracker carries every earlier round's status
  income: "NHATS_Round_{r}_Income_Imputation_File"  # optional; CHECK the file name in your release

ids:
  person: spid

design:
  weight: "w{r}anfinwgt0"
  stratum: "w{r}varstrat"
  psu: "w{r}varunit"

# NHATS negative codes are reasons for missingness, not values.
special_missing: [-1, -2, -3, -4, -5, -6, -7, -8, -9]

covariates:
  age:
    source: "r{r}d2intvrage"            # age category at interview, 1 = 65-69 ... 6 = 90+
    map: {1: 67, 2: 72, 3: 77, 4: 82, 5: 87, 6: 92}   # band midpoints in years
  sex:
    source: "r{r}dgender"
    map: {1: male, 2: female}
  race_group:
    source: "rl{r}dracehisp"
    map: {1: White, 2: Black, 3: Other, 4: Hispanic}

# Each indicator is oriented by `direction` in configs/study.yaml.
# The eleven indicators are those of Chapter 5 (Table loadings), in the domains
# of Chapter 3. NAMES marked [crosswalk] were checked against the NHATS Round 5
# Crosswalk between Instruments and Codebook (02/15/2024). RESPONSE CODES marked
# [assumed] could not be read from the documentation available here; the
# nhats-check report lists any observed value outside them.
indicators:
  # ---- Biomedical Potential (higher = more capacity)
  bio_multimorbidity:
    label: Chronic conditions absent, of ten
    kind: count_absent
    sources: ["hc{r}disescn1", "hc{r}disescn2", "hc{r}disescn3", "hc{r}disescn4", "hc{r}disescn5",
              "hc{r}disescn6", "hc{r}disescn7", "hc{r}disescn8", "hc{r}disescn9", "hc{r}disescn10"]  # [crosswalk]
    present: [1, 7]                      # 1 yes, 7 previously reported [assumed]
    codes: [1, 2, 7]
  bio_function:
    label: Self-care, mobility and household activities done alone without difficulty, of twelve
    kind: count_absent
    sources: ["sc{r}deatsfdf", "sc{r}dbathsfdf", "sc{r}dtoilsfdf", "sc{r}ddressfdf",     # derived self-care [crosswalk]
              "mo{r}dbedsfdf", "mo{r}dinsdsfdf", "mo{r}doutsfdf",                       # derived mobility [crosswalk]
              "ha{r}dlaunsfdf", "ha{r}dshopsfdf", "ha{r}dmealsfdf", "ha{r}dbanksfdf",  # derived household [crosswalk]
              "mc{r}dmedssfdf"]                                                          # derived medications [crosswalk]
    present: [2, 3, 4, 5]                # difficulty or cannot do alone; 1 = no difficulty [assumed]
    codes: [1, 2, 3, 4, 5]
  bio_cognition:
    label: Immediate and delayed word recall plus clock drawing
    kind: sum
    sources: ["cg{r}dwrdimmrc", "cg{r}dwrddlyrc", "cg{r}dclkdraw"]                     # [crosswalk]
  bio_psych:
    label: PHQ-2 and GAD-2 symptom-free score
    kind: reverse_sum
    sources: ["hc{r}depresan1", "hc{r}depresan2", "hc{r}depresan3", "hc{r}depresan4"]  # [crosswalk]
    range: [1, 4]                        # 1 not at all ... 4 nearly every day [assumed]
  # ---- Social Modifiers (higher = more enablement)
  soc_participation:
    label: Valued activities taken part in, of four
    kind: count_present
    sources: ["pa{r}vistfrfam", "pa{r}attrelser", "pa{r}clbmtgrac", "pa{r}outfrenjy"]  # [crosswalk]
    present: [1]                         # 1 yes [assumed]
    codes: [1, 2]
  soc_network:
    label: Social network size
    kind: value
    source: "sn{r}dnumsn"                # [crosswalk]
  soc_communication:
    label: Communication functions without difficulty, of four
    kind: count_present
    sources: ["ss{r}hearphone", "ss{r}convquiet", "ss{r}seewellst", "ss{r}glrednewp"]   # [crosswalk]
    present: [1]                         # 1 yes, can do [assumed]
    codes: [1, 2]
  # ---- Systemic Burdens (higher = more burden)
  sys_economic:
    label: Income shortfall, minus log household income
    kind: neg_log
    source: "ia{r}totinc"                # NOT in the SP crosswalk: income is in the income file; CHECK NAME
  sys_education:
    label: Schooling levels not completed, of nine
    kind: reverse
    source: "el{r}higstschl"             # NOT in the SP crosswalk; CHECK NAME and file
    range: [1, 9]                        # 1 no schooling ... 9 post-graduate [assumed]
  sys_environment:
    label: Home access barriers, of four
    kind: count_present
    sources: ["ho{r}entrstair", "ho{r}levelsflr", "ho{r}homeamen1", "ho{r}entrnramp"]   # [crosswalk]
    present_by_source:                   # barrier codes per item [assumed]
      "ho{r}entrstair": [1]              # stairs at the entrance: yes
      "ho{r}levelsflr": [2, 3, 4, 5]     # more than one level
      "ho{r}homeamen1": [2]              # bed, kitchen and bath not on one floor
      "ho{r}entrnramp": [2]              # no ramp at the entrance
  sys_care_access:
    label: Barriers to regular medical care, of two
    kind: count_present
    sources: ["mc{r}havregdoc", "mc{r}regdoclyr"]                                       # [crosswalk]
    present: [2]                         # 2 no regular doctor / not seen in last year [assumed]
    codes: [1, 2]

# Comparators built from baseline items only, never from outcomes.
comparators:
  comorbidity_index:
    kind: count_present
    sources: ["hc{r}disescn1", "hc{r}disescn2", "hc{r}disescn3", "hc{r}disescn4", "hc{r}disescn5",
              "hc{r}disescn6", "hc{r}disescn7", "hc{r}disescn8", "hc{r}disescn9", "hc{r}disescn10"]
    present: [1, 7]
  frailty_index:
    kind: deficit_fraction               # share of listed deficits present
    groups:
      - sources: ["hc{r}disescn1", "hc{r}disescn2", "hc{r}disescn3", "hc{r}disescn4", "hc{r}disescn5",
                  "hc{r}disescn6", "hc{r}disescn7", "hc{r}disescn8", "hc{r}disescn9", "hc{r}disescn10"]
        deficit: [1, 7]                  # condition reported
      - sources: ["pc{r}walk6blks", "pc{r}up20stair", "pc{r}car20pds", "pc{r}kneel", "pc{r}bdovrhd"]
        deficit: [2]                     # 2 = could not do it

  # Charlson-type index (Charlson et al. 1987) over the conditions NHATS asks
  # about: myocardial infarction 1, heart disease (taken as heart failure) 1,
  # diabetes 1, chronic lung disease 1, stroke 1, dementia 1, cancer 2.
  # Hypertension, arthritis and osteoporosis carry no Charlson weight. Age is
  # in every model as a covariate, so the index is not age-adjusted.
  charlson_index:
    kind: charlson
    present: [1, 7]
    weights:
      "hc{r}disescn1": 1
      "hc{r}disescn2": 1
      "hc{r}disescn6": 1
      "hc{r}disescn7": 1
      "hc{r}disescn8": 1
      "hc{r}disescn9": 1
      "hc{r}disescn10": 2

  # Functional status only: count of ADL and IADL activities reported as
  # difficult. Names are the derived 'without help' variables [crosswalk];
  # the difficulty codes are [assumed]. OPTIONAL: if absent from a release the
  # comparator is skipped and reported, never blocking the build.
  adl_iadl_count:
    kind: count_present
    optional: true
    sources: ["sc{r}deatsfdf", "sc{r}dbathsfdf", "sc{r}dtoilsfdf", "sc{r}ddressfdf",    # ADL: eating, bathing, toileting, dressing
              "mo{r}dbedsfdf", "mo{r}dinsdsfdf", "mo{r}doutsfdf",                    # ADL: bed, inside, outside
              "ha{r}dlaunsfdf", "ha{r}dshopsfdf", "ha{r}dmealsfdf", "ha{r}dbanksfdf",  # IADL
              "mc{r}dmedssfdf"]                                                  # IADL: medications
    present: [2, 3, 4, 5]                # [assumed] 1 no difficulty

  # Health-utility proxy: NHATS items crosswalked to the five EQ-5D-3L
  # dimensions and valued with an additive tariff. OPTIONAL and VERIFY as above.
  # The tariff below is the UK time trade-off tariff (Dolan 1997, Med Care
  # 35:1095-108). Checked against two published values: state 33333 gives
  # -0.594, and state 32333 gives -0.484, the UK minimum that Mozzi et al. 2016
  # (doi:10.2147/CEOR.S98226) report as -0.48, below 33332 (-0.429) as they
  # report. The level-2 weights for mobility, usual activities and pain are
  # not reached by these checks; confirm them against Dolan's table. Cut-points [a, b]: below a is level 1,
  # below b level 2, otherwise level 3.
  qaly_proxy:
    kind: eq5d_crosswalk
    optional: true
    dimensions:
      mobility:            # could not walk six blocks / climb 20 stairs
        sources: ["pc{r}walk6blks", "pc{r}up20stair"]
        present: [2]
        cuts: [1, 2]
      self_care:           # ADL difficulty count
        sources: ["sc{r}deatsfdf", "sc{r}dbathsfdf", "sc{r}dtoilsfdf", "sc{r}ddressfdf"]
        present: [2, 3, 4, 5]          # [assumed] 1 no difficulty
        cuts: [1, 3]
      usual_activities:    # IADL difficulty count
        sources: ["ha{r}dlaunsfdf", "ha{r}dshopsfdf", "ha{r}dmealsfdf", "ha{r}dbanksfdf"]
        present: [2, 3, 4, 5]          # [assumed] 1 no difficulty
        cuts: [1, 3]
      pain:                # bothered by pain; pain limits activities
        sources: ["ss{r}painbothr", "ss{r}painlimts"]
        present: [1]
        cuts: [1, 2]
      anxiety_depression:  # PHQ-2 + GAD-2 item sum, each 1 (not at all) to 4
        sources: ["hc{r}depresan1", "hc{r}depresan2", "hc{r}depresan3", "hc{r}depresan4"]
        sum: true
        cuts: [6, 10]
    tariff:
      constant: 0.081
      n3: 0.269
      mobility: [0.069, 0.314]
      self_care: [0.104, 0.214]
      usual_activities: [0.036, 0.094]
      pain: [0.123, 0.386]
      anxiety_depression: [0.071, 0.236]

# Outcomes from the tracker files. Event time is the midpoint of the interval
# between the last round seen alive and the round that first reports the event.
outcomes:
  mortality:
    status: "r{k}status"
    event_codes: [62]                    # deceased: confirm in the tracker codebook
  hospitalisation:
    sp_item: "hc{k}hosptstay"            # overnight hospital stay since last interview, from follow-up SP files
    present: [1]

# Medical groupings for figures (labels only; same items as above).
conditions:
  heart_attack: "hc{r}disescn1"
  heart_disease: "hc{r}disescn2"
  hypertension: "hc{r}disescn3"
  arthritis: "hc{r}disescn4"
  osteoporosis: "hc{r}disescn5"
  diabetes: "hc{r}disescn6"
  lung_disease: "hc{r}disescn7"
  stroke: "hc{r}disescn8"
  dementia: "hc{r}disescn9"
  cancer: "hc{r}disescn10"
