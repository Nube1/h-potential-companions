[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpotential-realworld"
version = "1.1.0"
description = "NHATS ingestion, outcome-blind measurement, prognostic validation and figures for H-Potential"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "lifelines>=0.29,<1", "PyYAML>=6,<7",
  "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pyarrow>=14", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]

[project.scripts]
hpotential = "hpotential.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B007"]

