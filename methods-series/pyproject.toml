[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpotential"
version = "1.1.0"
description = "Reproducible code for the H-potential health-capability methods series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "H-potential methods series authors" }]
keywords = [
  "psychometrics",
  "factor score determinacy",
  "item response theory",
  "Delphi",
  "differential item functioning",
  "health technology assessment",
  "value of information",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.scripts]
hpotential-data = "hpotential.data.cli:main"

[project.optional-dependencies]
full = [
  "statsmodels>=0.14",
  "factor_analyzer>=0.4",
  "openpyxl>=3.1",
  "pyarrow>=14",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "black>=24.1",
  "pre-commit>=3.5",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/Nube1/h-potential-companions"
Issues = "https://github.com/Nube1/h-potential-companions/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpotential = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --doctest-modules -m 'not slow'"
testpaths = ["tests", "src/hpotential"]
markers = [
  "slow: regression against the published values; run with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "NPY"]
ignore = [
  "E741",   # ambiguous names such as l are used for loadings in the algebra
  "B008",   # default arguments call numpy.array to hold published constants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# This module embeds notebook markdown and code as string literals. Wrapping them
# to satisfy the line limit would corrupt the rendered notebook content.
"scripts/build_notebooks.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
