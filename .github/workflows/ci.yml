name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          # Skip archive/: it is large and has paths too long for Windows.
          sparse-checkout: |
            hpotential
            tests
            analysis
            results
            papers
            examples
            docs
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-report=term-missing

  results-and-papers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          # Skip archive/: it is large and has paths too long for Windows.
          sparse-checkout: |
            hpotential
            tests
            analysis
            results
            papers
            examples
            docs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-fonts-recommended
      - run: python -m pip install -r requirements.txt
      - name: Regenerate results
        run: python analysis/reproduce.py
      - name: Committed results must be unchanged
        run: git diff --exit-code -- results/*.csv
      - name: Build papers with LaTeX
        run: python analysis/build_papers.py --engine latex
      - name: Generated LaTeX must match the committed copy
        run: git diff --exit-code -- papers/*.tex
      - run: python analysis/verify_delivery.py
      - uses: actions/upload-artifact@v5
        with:
          name: companion-papers-and-results
          path: |
            papers/*.pdf
            results/
