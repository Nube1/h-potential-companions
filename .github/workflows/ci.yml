name: CI

# One job group per project folder. Each checkout fetches only the folder it
# needs, which also skips archive/ (large, and with paths too long for Windows).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: no participant data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            companions
            methods-series
            realworld-pipeline
            tools
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/guard_data.py
      - run: pipx run ruff check tools

  companions-test:
    name: companions (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: companions
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: companions
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: companions/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-report=term-missing

  companions-papers:
    runs-on: ubuntu-latest
    needs: companions-test
    defaults:
      run:
        working-directory: companions
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: companions
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-fonts-recommended
      - run: python -m pip install -r requirements.txt
      - name: Regenerate results
        run: python analysis/reproduce.py
      - name: Committed results must be unchanged
        run: git diff --exit-code -- results/*.csv
      - name: Build papers with LaTeX
        run: python analysis/build_papers.py --engine latex
      - name: Generated LaTeX must match the committed copy
        run: git diff --exit-code -- papers/*.tex
      - name: Proof figures (each carries a numeric check)
        run: python analysis/proof_figures.py
      - run: python analysis/verify_delivery.py
      - uses: actions/upload-artifact@v5
        with:
          name: companion-papers-and-results
          path: |
            companions/papers/*.pdf
            companions/results/
            companions/figures/

  methods-series:
    name: methods-series (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: methods-series
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: methods-series
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: methods-series/pyproject.toml
      - run: python -m pip install -e ".[full,dev]"
      - run: ruff check src tests scripts
      - run: black --check src tests scripts
      - run: python -m pytest -q --cov=hpotential --cov-report=term
      - name: Published-value regressions
        if: matrix.python == '3.12'
        run: python -m pytest -q -m slow

  realworld-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realworld-pipeline
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: realworld-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: realworld-pipeline/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest --cov=hpotential --cov-report=term-missing
      - name: NHATS-layout demo (made-up files -> extract -> run -> figures)
        run: hpotential demo --output outputs/ci --n 1500 --reps 100
      - uses: actions/upload-artifact@v5
        with:
          name: realworld-synthetic-evidence
          path: |
            realworld-pipeline/outputs/ci/*.json
            realworld-pipeline/outputs/ci/model_performance.csv
            realworld-pipeline/outputs/ci/equity_performance.csv
            realworld-pipeline/outputs/ci/figures/

  thesis-verification:
    # The 126 tests that assert every worked example and formal claim in the
    # thesis, plus the Python analysis scripts that replaced the R scaffold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: thesis
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<9"
      - run: python -m pytest -q thesis/verification/tests
      - run: python thesis/analysis/04_formal_property_checks.py
